[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linbot-voice-agent"
version = "0.2.0"
description = "Hospital companion text agent with mock robot tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
linbot = "linbot_voice_agent.cli:main"

[tool.setuptools.packages.find]
include = ["linbot_voice_agent*"]

[tool.setuptools.package-data]
linbot_voice_agent = ["data/*.json", "data/seeds/*.json"]
